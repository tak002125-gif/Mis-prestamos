name: Build PrestaPro Admin APK

on:
  push:
    branches: [ main ]
    paths:
      - 'PrestaPro_Admin_Android_Proyecto.zip'
      - '.github/workflows/build-admin-apk.yml'
  workflow_dispatch:

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer proyecto PrestaPro Admin
        run: |
          rm -rf admin-project
          mkdir -p admin-project
          unzip -q PrestaPro_Admin_Android_Proyecto.zip -d admin-project
          test -f admin-project/settings.gradle
          test -f admin-project/app/build.gradle

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar firma permanente
        env:
          TACA_KEYSTORE_BASE64: ${{ secrets.TACA_KEYSTORE_BASE64 }}
          TACA_KEYSTORE_PASSWORD: ${{ secrets.TACA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$TACA_KEYSTORE_BASE64" ]; then
            echo "Falta el secreto TACA_KEYSTORE_BASE64"
            exit 1
          fi
          if [ -z "$TACA_KEYSTORE_PASSWORD" ]; then
            echo "Falta el secreto TACA_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$TACA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prestapro-admin.jks"

      - name: Compilar PrestaPro Admin
        working-directory: admin-project
        env:
          TACA_KEYSTORE_PATH: ${{ runner.temp }}/prestapro-admin.jks
          TACA_KEYSTORE_PASSWORD: ${{ secrets.TACA_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verificar firma
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs admin-project/app/build/outputs/apk/release/app-release.apk

      - name: Guardar APK Admin
        uses: actions/upload-artifact@v4
        with:
          name: PrestaPro-Admin-v0.1.0-APK
          path: admin-project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
