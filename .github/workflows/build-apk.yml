name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Extraer proyecto Android
        run: unzip -o MisPrestamos_Android_Proyecto.zip -d android-project

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar firma permanente
        env:
          TACA_KEYSTORE_BASE64: ${{ secrets.TACA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TACA_KEYSTORE_BASE64" ]; then
            echo "Falta el secreto TACA_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$TACA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/taca-money.jks"

      - name: Compilar APK firmado
        working-directory: android-project
        env:
          TACA_KEYSTORE_PATH: ${{ runner.temp }}/taca-money.jks
          TACA_KEYSTORE_PASSWORD: ${{ secrets.TACA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$TACA_KEYSTORE_PASSWORD" ]; then
            echo "Falta el secreto TACA_KEYSTORE_PASSWORD"
            exit 1
          fi
          gradle assembleRelease

      - name: Verificar firma
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android-project/app/build/outputs/apk/release/app-release.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TACA-Money-v2.1-APK
          path: android-project/app/build/outputs/apk/release/app-release.apk
